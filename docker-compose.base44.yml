services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    # .env (committed) supplies VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
    # and their non-VITE_ SSR counterparts; Vite loads it automatically.
    ports:
      - "3000:5173"
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
